# ===============================
# = SERVER
# ===============================
server.port=${PORT:8080}
spring.application.name=fuel-queue-backend

# ===============================
# = POSTGRESQL DATASOURCE
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# application-prod.properties (Postgres)
spring.sql.init.schema-locations=classpath:schema-postgres.sql
# IMPORTANT: keep this if you use data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Show SQL (optional for dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = REMOVE H2 CONSOLE (not needed)
# ===============================
# spring.h2.console.enabled=true  ? REMOVE
# spring.h2.console.path=/h2-console ? REMOVE

# ===============================
# = JWT (UNCHANGED)
# ===============================
app.jwt.secret=${JWT_SECRET:defaultSecret123}
app.jwt.expiration-ms=86400000
