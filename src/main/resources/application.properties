server.port=8080
spring.application.name=fuel-queue-backend

# ?? H2 In-Memory DB (zero install) ???????????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:fuelqueue;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?? JWT ???????????????????????????????????????????????????????????????????????
app.jwt.secret=FuelQueueSuperSecretKeyForJWTSigning2024XYZ
app.jwt.expiration-ms=86400000

# ?? Crowd thresholds ??????????????????????????????????????????????????????????
app.crowd.low-max=2
app.crowd.medium-max=6
app.crowd.minutes-per-vehicle=3
app.crowd.user-ttl-seconds=30
